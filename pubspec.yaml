name: dreamshelf
description: A book tracking app to manage your reading journey.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Monetization
  google_mobile_ads: ^4.0.0
  in_app_purchase: ^3.1.13

  # Barcode Scanner
  mobile_scanner: ^3.5.6

  # Networking
  http: ^1.1.2
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^0.66.0

  # Utilities
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  intl: ^0.18.1
  uuid: ^4.2.2

  # Routing
  go_router: ^13.0.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  bloc_test: ^9.1.5
  mocktail: ^1.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
